name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - "20"
          - "22"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: npm test

      - name: Install from the packed tarball, then setup --dry-run in a throwaway home
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install -g --prefix "$prefix" "./$tarball"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$prefix"; else bin="$prefix/bin"; fi
          version="$("$bin/quriov" --version)"
          expected="$(node -p 'require("./package.json").version')"
          test "$version" = "$expected" || { echo "installed quriov reports $version, expected $expected"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then pkg="$prefix/node_modules/quriov"; else pkg="$prefix/lib/node_modules/quriov"; fi
          test -f "$pkg/skill/SKILL.md" || { echo "skill/SKILL.md missing from the package"; exit 1; }
          fake_home="$(mktemp -d)"
          mkdir -p "$fake_home/.claude" "$fake_home/.codex"
          out="$(HOME="$fake_home" USERPROFILE="$fake_home" "$bin/quriov" setup --dry-run < /dev/null)"
          echo "$out"
          echo "$out" | grep -q "Claude Code：写入 MCP「quriov」"
          echo "$out" | grep -q "Codex：写入 MCP「quriov」"
          test ! -e "$fake_home/.claude.json" || { echo "--dry-run wrote a file"; exit 1; }
          if [ "$RUNNER_OS" = "Windows" ]; then echo "prefix=$(cygpath -w "$prefix")" >> "$GITHUB_ENV"; fi
          rm -f "$tarball"

      - name: PowerShell path (quriov.cmd, key piped on stdin)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $fake = Join-Path $env:RUNNER_TEMP "fake-home"
          New-Item -ItemType Directory -Force -Path (Join-Path $fake ".cursor") | Out-Null
          $env:USERPROFILE = $fake
          $env:HOME = $fake
          & "$env:prefix\quriov.cmd" --version
          $out = 'ci-placeholder-key-not-real-0000' | & "$env:prefix\quriov.cmd" setup --dry-run --key-stdin
          $out
          if (-not ($out -match "Cursor")) { throw "setup --dry-run did not list Cursor" }
          if (Test-Path (Join-Path $fake ".cursor\mcp.json")) { throw "--dry-run wrote a file" }

  checks:
    name: Secrets and hard-coded facts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fail on secret-like content, stray URLs, and facts that go stale
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFile } from "node:fs/promises";

          const tracked = execFileSync("git", ["ls-files"], { encoding: "utf8" }).trim().split(/\r?\n/).filter(Boolean);
          const secretPatterns = [
            /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/,
            /\bsk-[A-Za-z0-9_-]{16,}\b/,
            /\bqry_live_[A-Za-z0-9_-]{16,}\b/,
            /\bqv_[A-Za-z0-9_-]{16,}\b/i,
          ];
          const problems = [];
          for (const path of tracked) {
            const text = await readFile(path, "utf8").catch(() => "");
            if (secretPatterns.some((p) => p.test(text))) problems.push(`secret-like content in ${path}`);
            if (/^(bin|lib)\//.test(path)) {
              // Every Quriov URL is built from the single ORIGIN constant in lib/common.mjs.
              for (const m of text.matchAll(/https:\/\/quriovai\.com[^\s"'`)]*/g)) {
                if (m[0] !== "https://quriovai.com") problems.push(`${path} hard-codes ${m[0]} (build it from ORIGIN)`);
              }
            }
            if (["README.md", "AGENTS.md", "SECURITY.md", "skill/SKILL.md"].includes(path)) {
              // These go stale: the version lives only in package.json, the tool list and limits only on the server.
              if (/\bv?\d+\.\d+\.\d+\b/.test(text)) problems.push(`${path} mentions a version number`);
              if (/exactly (eight|8)|恰好 ?8|8 个工具|8 项|每分钟 ?\d+ ?次|每天 ?\d+ ?次/.test(text)) {
                problems.push(`${path} hard-codes a tool count or a server limit`);
              }
            }
          }
          if (problems.length) {
            console.error(problems.join("\n"));
            process.exit(1);
          }
          console.log(`checked ${tracked.length} tracked files`);
          NODE
